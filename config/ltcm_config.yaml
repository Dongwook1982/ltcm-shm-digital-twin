# ─────────────────────────────────────────────────────────────────────────────
# LTCM System Configuration
# Signal-Driven Lifecycle Memory for SHM Digital Twins
# Dong-Wook Kim, DL E&C Co., Ltd.
# Corresponding to: submitted to MSSP manuscript, Appendices A–C
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  version: "1.0.0"
  paper_title: "Signal-Driven Lifecycle Memory for SHM Digital Twins: A MARG Framework"
  doi: "to_be_assigned_upon_publication"
  date: "2024-01-01"

# ═══════════════════════════════════════════════════════════════════════════════
# 1. CLS-LTCM CONSOLIDATION ALGORITHM  (Sec 4.1)
# ═══════════════════════════════════════════════════════════════════════════════
cls_ltcm:
  # Significance scoring: S(m) = w1*sev + w2*uniq + w3*decay
  weights:
    w1_severity:       0.45   # Weight for severity score (0-1 normalized)
    w2_uniqueness:     0.35   # Weight for uniqueness = 1 - max_sim(m, E)
    w3_temporal_decay: 0.20   # Weight for temporal recency
  
  # Consolidation thresholds (grid-search optimized on Case A training set)
  thresholds:
    tau:     0.30   # Significance threshold — below: consolidate to Semantic
    delta:   0.85   # Cosine similarity threshold for consolidation target
    lambda:  0.05   # Temporal decay rate (yr^-1)
  
  # Memory tier thresholds
  memory_tiers:
    hot:
      condition: "accessed_within_days <= 30 OR significance > 0.70"
      storage: "NVMe SSD (primary)"
    warm:
      condition: "30 < accessed_within_days <= 365 AND significance > 0.30"
      storage: "NVMe SSD (secondary)"
    cold:
      condition: "accessed_within_days > 365 AND significance <= 0.30"
      storage: "HDD RAID-6"

# ═══════════════════════════════════════════════════════════════════════════════
# 2. MARG RETRIEVAL ALGORITHM  (Sec 4.2)
# ═══════════════════════════════════════════════════════════════════════════════
marg:
  # Stage 1 — SPARQL structured retrieval
  sparql:
    k1_candidates: 30           # Number of exact-match SPARQL candidates
    endpoint: "http://localhost:3030/ltcm/sparql"
    
  # Stage 2 — TransE embedding-based retrieval
  transe:
    embedding_dim: 128          # d in paper
    top_k: 15                   # Final context window size
    
  # Composite relevance scoring weights
  # R(m) = alpha*recency + beta*semantic_sim + gamma*severity + delta*spatial_overlap
  scoring_weights:
    alpha_recency:      0.25    # Temporal recency weight
    beta_semantic_sim:  0.35    # TransE cosine similarity weight
    gamma_severity:     0.25    # Severity score weight
    delta_spatial:      0.15    # Spatial overlap weight
    # Optimized by grid search on training set (n=240 queries)
    # Reported MAP@5 on held-out test set (n=320): 0.913
    
  # Stage 3 — LLM generation
  llm:
    model_id:   "gpt-4o-2024-08-06"
    mode:       "zero-shot"
    max_tokens: 800
    temperature: 0.0             # Deterministic generation for reproducibility
    token_budget:
      system_prompt:  450       # Domain role + citation instruction
      context:       3200       # 15 retrieved records as structured JSON
      user_query:     ~200      # Maintenance query
      total_max:     4650
    
  # Context assembly
  context:
    min_records_per_type: 1     # Memory type diversity enforcement
    record_format: "json"       # Fields: memory_id, memory_type, timestamp, asset_guid,
                                # signal_values, severity_score, relevant_code, uncertainty_estimate
  
  # Factual grounding check
  grounding:
    enabled: true
    hallucination_rate_baseline: 0.083   # 8.3% without check
    hallucination_rate_with_check: 0.017 # 1.7% with check

# ═══════════════════════════════════════════════════════════════════════════════
# 3. TransE GRAPH EMBEDDING  (Appendix A)
# ═══════════════════════════════════════════════════════════════════════════════
transe_training:
  embedding_dim:          128
  optimizer:              "Adam"
  learning_rate:          0.001
  adam_beta1:             0.9
  adam_beta2:             0.999
  batch_size:             512
  negative_samples_k:     25
  margin_gamma:           1.0
  l2_regularization:      0.001
  max_epochs:             1000
  early_stopping_patience: 50    # Epochs on validation MAP@10
  framework:              "PyKEEN 1.10"
  # Knowledge graph statistics
  kg_statistics:
    total_triples:        321700
    case_a_triples:       127400   # Railway viaduct
    case_b_triples:        94300   # Expressway
    case_c_triples:       100000   # PSC bridge
    episodic_records_total: 6534   # Post-consolidation (3 assets)
    case_a_episodic:        2341
    case_b_episodic:        2146
    case_c_episodic:        2047

# ═══════════════════════════════════════════════════════════════════════════════
# 4. PINN DEGRADATION MODELS  (Sec 5.1, Sec 5.1)
# ═══════════════════════════════════════════════════════════════════════════════
pinn:
  # Architecture by degradation mechanism
  networks:
    track_settlement:           # Sato-Odaka: d = α·N^β
      hidden_layers:    4
      neurons_per_layer: 64
      activation:       "tanh"
      governing_equation: "Sato-Odaka: d = alpha * N^beta"
      pinn_parameters:
        alpha_range: [0.9, 1.5]   # Case A fitted: 1.21
        beta_range:  [0.68, 0.75] # Case A fitted: 0.72
    
    fatigue_crack_growth:       # Paris law: da/dN = C(ΔK)^m
      hidden_layers:    5
      neurons_per_layer: 64
      activation:       "tanh"
      governing_equation: "Paris law: da/dN = C*(delta_K)^m"
    
    bearing_degradation:        # Power-law: M_loss = k·t^n
      hidden_layers:    4
      neurons_per_layer: 64
      activation:       "tanh"
      governing_equation: "Power-law mass-loss: M_loss = k * t^n"

  # Training configuration (common to all)
  training:
    optimizer:              "Adam"
    learning_rate:          0.001   # η = 10^-3
    physics_loss_weight:    0.1     # λ_phys — weighting of physics residual vs data loss
    max_epochs:             5000
    early_stopping_patience: 200   # Epochs on validation loss
    data_split:
      train: 0.70
      val:   0.15
      test:  0.15
      split_strategy: "temporal"   # Sequential by time, no leakage
    
  # Uncertainty quantification
  uncertainty:
    method:        "Monte Carlo Dropout"
    forward_passes: 100            # T = 100
    confidence_level: 0.95        # 95% confidence interval
    
  # Baseline comparison
  baseline:
    model: "Standard neural network (no physics constraints)"
    architecture: "identical to PINN (no physics penalty term)"
    rmse_3yr_corpus:
      baseline_nn: 2.8            # yr
      pinn:        3.1            # yr (3-year corpus)
    rmse_12yr_corpus:
      baseline_nn: 2.8            # yr (does not improve with corpus size)
      pinn:        1.4            # yr (55% improvement from corpus growth)
    physics_regularization_improvement: 0.50  # 50% RMSE improvement from physics constraints alone

# ═══════════════════════════════════════════════════════════════════════════════
# 5. KNOWLEDGE GRAPH — OWL-DL ONTOLOGY  (Sec 3.3)
# ═══════════════════════════════════════════════════════════════════════════════
ontology:
  profile:             "OWL 2 DL"
  reasoner:            "Pellet"
  triplestore:         "Apache Jena Fuseki 4.9.0 (RDF-star)"
  sparql_version:      "SPARQL 1.1"
  owl_classes:         127
  object_properties:   84
  datatype_properties: 56
  ifc_mappings:        38          # IFC 4.3 element types mapped to LTCM RDF entities
  consistency:         "satisfiable (Pellet verified)"
  performance:
    p95_query_latency_s: 2.1      # SPARQL endpoint
    
  # Key IFC 4.3 → LTCM RDF mappings (see ltcm_ifc_mapping.ttl for full set)
  ifc_mapping_examples:
    - ifc: "IfcBearing"
      ltcm: ["ltcm:BearingAsset", "ltcm:FailureMode"]
    - ifc: "IfcAlignment"
      ltcm: ["ltcm:GeometricAsset", "ltcm:TrackSettlement"]
    - ifc: "IfcPavement"
      ltcm: ["ltcm:PavementAsset", "ltcm:ConditionNode"]
    - ifc: "IfcBeam (PSC)"
      ltcm: ["ltcm:StructuralElement", "ltcm:MaterialProperty"]
    - ifc: "IfcBridgePart"
      ltcm: ["ltcm:EventAnchor"]

# ═══════════════════════════════════════════════════════════════════════════════
# 6. SYSTEM HARDWARE AND SOFTWARE  (Appendix C)
# ═══════════════════════════════════════════════════════════════════════════════
system:
  hardware:
    cpu: "Intel Xeon E5-2690 v4 (28 cores, 2.60 GHz)"
    ram_gb: 64
    storage_hot_warm: "2× 960 GB NVMe SSD"
    storage_cold: "12 TB HDD RAID-6"
  
  software:
    os: "Ubuntu 22.04 LTS"
    triplestore: "Apache Jena Fuseki 4.9.0 (RDF-star extension)"
    embedding_framework: "PyKEEN 1.10"
    llm_api: "OpenAI API (gpt-4o-2024-08-06)"
    ontology_reasoner: "Pellet 2.4 (OWL 2 DL)"
    iot_streaming: "Apache Kafka 3.5"
    anomaly_detection: "Isolation Forest (scikit-learn 1.3)"
    api_server: "Python Flask 3.0 + REST API"
  
  latency:
    sparql_p95_s: 2.1
    marg_embedding_p95_s: 2.6
    end_to_end_p95_s: 4.7
    usability_threshold_s: 5.0

# ═══════════════════════════════════════════════════════════════════════════════
# 7. EVALUATION DESIGN  (Sec 5.5, 5.6)
# ═══════════════════════════════════════════════════════════════════════════════
evaluation:
  retrieval:
    total_queries: 560
    training_set:
      n: 240
      purpose: "MARG weight optimization (grid search)"
    held_out_test_set:
      n: 320
      breakdown_per_type: 80        # 80 per memory type × 4 types
      inter_rater_agreement_kappa: 0.83
      agreement_level: "substantial"
      raters: 3                     # Senior maintenance engineers
    supplementary_s1_subset: 40    # Representative subset from held-out test
    metrics: ["MAP@5", "MAP@10"]
  
  engineer_evaluation:
    design: "controlled within-subjects"
    n: 32
    organizations: 3               # 1 railway, 1 expressway, 1 bridge operator
    counterbalancing: true
    demographics:
      experience_range_yr: [8, 27]
      mean_experience_yr: 16.8
      sd_experience_yr: 5.3
    roles:
      bridge_inspector: 12
      railway_track_engineer: 11
      road_pavement_engineer: 9
    primary_metric: "maintenance planning time (hr/cycle)"
    statistical_tests:
      planning_time: "paired t-test (t(31)=9.84, p<0.001)"
      confidence_likert: "Wilcoxon signed-rank (Z=4.89, p<0.001)"
    results:
      planning_time_reduction_pct: 36.4
      ci_95_lower_pct: 29.1
      ci_95_upper_pct: 43.7
      cohens_d: 1.74
      missed_precedents_reduction_pct: 91.0
